<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 700" role="img" aria-labelledby="diag-title diag-desc">
      <title id="diag-title">Sơ đồ Kiến trúc Hệ thống Elder Care ESP32-S3</title>
      <desc id="diag-desc">Sơ đồ 3 tuyến dữ liệu song song mở rộng chiều ngang 1680px với sự đối xứng hoàn hảo cho các nhãn Cảnh Báo, HR/SpO2 và Nhiệt Độ.</desc>

      <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
        .node-title { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
        .node-sub { font-family: 'Geist Mono', monospace; font-size: 9.5px; fill: #94a3b8; }
        .node-tag { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.08em; }
        .zone-title { font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; fill: #94a3b8; }
        .arrow-text { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #94a3b8; letter-spacing: 0.05em; text-anchor: middle; }
      </style>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
        </marker>
        <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
        </marker>
        <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c084fc"/>
        </marker>
      </defs>

      <!-- Background paper -->
      <rect width="100%" height="100%" fill="#0f172a"/>

      <!-- ================= TRACK 1: GIA TỐC & PHÁT HIỆN TÉ NGÃ (x: 20 -> 1060, y: 40 -> 220) ================= -->
      <rect x="20" y="40" width="1040" height="180" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="40" y="28" width="460" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="270" y="44" class="zone-title" fill="#38bdf8" text-anchor="middle">🚀 LINE 1: GIA TỐC &amp; PHÁT HIỆN TÉ NGÃ (ESP32-S3 CORE 1)</text>

      <!-- MPU6050 -->
      <g transform="translate(45, 80)">
        <rect width="190" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="10" y="10" width="65" height="16" rx="3" fill="rgba(56, 189, 248, 0.12)"/>
        <text x="42.5" y="21" class="node-tag" fill="#38bdf8" text-anchor="middle">IMU 6-AXIS</text>
        <text x="95" y="52" class="node-title" text-anchor="middle">MPU6050 Sensor</text>
        <text x="95" y="72" class="node-sub" text-anchor="middle">Gia tốc &amp; Con quay (0x68)</text>
        <text x="95" y="88" class="node-sub" text-anchor="middle">Bus I2C (SDA:8 / SCL:9)</text>
      </g>

      <!-- mpu6050_module -->
      <g transform="translate(400, 80)">
        <rect width="230" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="115" y="32" class="node-title" text-anchor="middle">mpu6050_module</text>
        <text x="115" y="54" class="node-sub" text-anchor="middle">• Đọc raw ax, ay, az, gx, gy, gz</text>
        <text x="115" y="72" class="node-sub" text-anchor="middle">• Lọc EMA (α=0.6) làm mịn</text>
        <text x="115" y="90" class="node-sub" text-anchor="middle">• Cập nhật struct FilteredData</text>
      </g>

      <!-- fall_detection -->
      <g transform="translate(710, 70)">
        <rect width="330" height="135" rx="6" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="2"/>
        <rect x="10" y="8" width="90" height="16" rx="3" fill="#f97316"/>
        <text x="55" y="19" class="node-tag" fill="#ffffff" text-anchor="middle">FOCAL ENGINE</text>
        <text x="165" y="44" class="node-title" fill="#f97316" text-anchor="middle">fall_detection State Machine</text>

        <line x1="15" y1="54" x2="315" y2="54" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="165" y="70" class="node-sub" text-anchor="middle">• Free Fall: &lt;0.3g | Impact: &gt;2.5g</text>
        <text x="165" y="86" class="node-sub" text-anchor="middle">• Stillness: 2000ms nằm yên</text>
        <text x="165" y="106" class="node-sub" fill="#f97316" font-weight="600" text-anchor="middle">➔ KÍCH HOẠT CẢNH BÁO TÉ NGÃ</text>
      </g>


      <!-- ================= TRACK 2: NHỊP TIM & SPO2 (x: 20 -> 1060, y: 250 -> 430) ================= -->
      <rect x="20" y="250" width="1040" height="180" rx="8" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1.2"/>
      <rect x="40" y="238" width="530" height="24" rx="4" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="305" y="254" class="zone-title" fill="#c084fc" text-anchor="middle">💓 LINE 2: NHỊP TIM &amp; SPO2 (ESP32-S3 CORE 0 — DEDICATED DSP TASK)</text>

      <!-- MAX30102 -->
      <g transform="translate(45, 290)">
        <rect width="190" height="110" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <rect x="10" y="10" width="70" height="16" rx="3" fill="rgba(192, 132, 252, 0.12)"/>
        <text x="45" y="21" class="node-tag" fill="#c084fc" text-anchor="middle">PULSE &amp; SPO2</text>
        <text x="95" y="52" class="node-title" text-anchor="middle">MAX30102 Sensor</text>
        <text x="95" y="72" class="node-sub" text-anchor="middle">Quang học (I2C Addr: 0x57)</text>
        <text x="95" y="88" class="node-sub" text-anchor="middle">IR &amp; Red Channel @ 100Hz</text>
      </g>

      <!-- TaskMAX30102 -->
      <g transform="translate(400, 290)">
        <rect width="640" height="110" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="320" y="32" class="node-title" text-anchor="middle">TaskMAX30102 (FreeRTOS Task 16KB Stack — Core 0)</text>

        <line x1="20" y1="46" x2="620" y2="46" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="320" y="66" class="node-sub" text-anchor="middle">• Sliding Window Buffer 100 samples (Thu thập &amp; xử lý tín hiệu liên tục)</text>
        <text x="320" y="84" class="node-sub" text-anchor="middle">• Peak Detection (RR-Interval) + Lọc Median 5 mẫu loại bỏ nhiễu nhịp tim đột biến</text>
        <text x="320" y="100" class="node-sub" text-anchor="middle">• Thuật toán Maxim SpO2 ➔ Đồng bộ chỉ số nhịp tim &amp; SpO2 vào healthData</text>
      </g>


      <!-- ================= TRACK 3: NHIỆT ĐỘ CƠ THỂ (x: 20 -> 1060, y: 460 -> 640) ================= -->
      <rect x="20" y="460" width="1040" height="180" rx="8" fill="rgba(74, 222, 128, 0.12)" stroke="#4ade80" stroke-width="1.2"/>
      <rect x="40" y="448" width="400" height="24" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
      <text x="240" y="464" class="zone-title" fill="#4ade80" text-anchor="middle">🌡️ LINE 3: NHIỆT ĐỘ CƠ THỂ (LM75 POLLING)</text>

      <!-- LM75 Sensor -->
      <g transform="translate(45, 500)">
        <rect width="190" height="110" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
        <rect x="10" y="10" width="60" height="16" rx="3" fill="rgba(74, 222, 128, 0.12)"/>
        <text x="40" y="21" class="node-tag" fill="#4ade80" text-anchor="middle">TEMP I2C</text>
        <text x="95" y="52" class="node-title" text-anchor="middle">LM75 Sensor</text>
        <text x="95" y="72" class="node-sub" text-anchor="middle">Nhiệt độ (I2C Addr: 0x48)</text>
        <text x="95" y="88" class="node-sub" text-anchor="middle">Độ phân giải 0.125°C</text>
      </g>

      <!-- lm75_module -->
      <g transform="translate(400, 500)">
        <rect width="640" height="110" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.2"/>
        <text x="320" y="32" class="node-title" text-anchor="middle">lm75_module (Polling Nhiệt Độ)</text>

        <line x1="20" y1="46" x2="620" y2="46" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="320" y="68" class="node-sub" text-anchor="middle">• Truy vấn thanh ghi 0x00 định kỳ 5000ms/lần qua I2C Bus</text>
        <text x="320" y="88" class="node-sub" text-anchor="middle">• Chuyển đổi định dạng 11-bit Two's Complement ➔ Ghi nhiệt độ cơ thể (°C) vào healthData</text>
      </g>


      <!-- ================= RIGHT REGION: CLOUD INFRASTRUCTURE (x: 1300 -> 1640, width: 340) ================= -->
      <rect x="1300" y="40" width="340" height="600" rx="8" fill="rgba(148, 163, 184, 0.02)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2"/>
      <rect x="1320" y="28" width="300" height="24" rx="4" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="1470" y="44" class="zone-title" text-anchor="middle">☁️ 4. CLOUD INFRASTRUCTURE (TLS MQTT)</text>

      <!-- mqtt_manager -->
      <g transform="translate(1320, 90)">
        <rect width="300" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="12" y="10" width="75" height="18" rx="3" fill="rgba(56, 189, 248, 0.12)"/>
        <text x="49.5" y="22" class="node-tag" fill="#38bdf8" text-anchor="middle">TLS / MQTT</text>
        <text x="150" y="48" class="node-title" text-anchor="middle">mqtt_manager</text>
        <text x="150" y="68" class="node-sub" text-anchor="middle">WiFi STA &amp; WiFiClientSecure Client</text>

        <line x1="20" y1="80" x2="280" y2="80" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="150" y="102" class="node-sub" text-anchor="middle">• Kết nối WiFi 2.4GHz với Auto-Reconnect</text>
        <text x="150" y="124" class="node-sub" text-anchor="middle">• ArduinoJson Payload Serializer</text>
        <text x="150" y="146" class="node-sub" text-anchor="middle">• Thu thập sinh hiệu từ healthData (healthMutex)</text>
        <text x="150" y="168" class="node-sub" text-anchor="middle">• Đóng gói JSON Payload bảo mật</text>
        <text x="150" y="195" class="node-sub" fill="#f97316" font-weight="600" text-anchor="middle">➔ Gửi định kỳ 1Hz &amp; Phát tức thì khi Té Ngã</text>
      </g>

      <!-- HiveMQ Cloud Broker -->
      <g transform="translate(1320, 400)">
        <rect width="300" height="210" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
        <rect x="12" y="10" width="85" height="18" rx="3" fill="rgba(249, 115, 22, 0.15)"/>
        <text x="54.5" y="22" class="node-tag" fill="#f97316" text-anchor="middle">CLOUD BROKER</text>
        <text x="150" y="48" class="node-title" fill="#f97316" text-anchor="middle">HiveMQ Cloud Broker</text>
        <text x="150" y="68" class="node-sub" text-anchor="middle">TLS/SSL Security (Port 8883)</text>

        <line x1="20" y1="80" x2="280" y2="80" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="150" y="105" class="node-sub" text-anchor="middle">• Topic: eldercare/test_nga</text>
        <text x="150" y="130" class="node-sub" fill="#f97316" font-weight="600" text-anchor="middle">• Nhận Real-time JSON Payload</text>
        <text x="150" y="150" class="node-sub" text-anchor="middle">(Nhịp tim, SpO2, Nhiệt độ cơ thể)</text>
        <text x="150" y="175" class="node-sub" fill="#f97316" font-weight="600" text-anchor="middle">+ Cảnh Báo Té Ngã Khẩn Cấp</text>
      </g>


      <!-- ================= ARROWS & CONNECTORS (HOÀN HẢO 100% - KHÔNG CHẠM VIỀN) ================= -->

      <!-- i2cMutex badges between Sensors (x=235) and Modules (x=400) - Gap 165px -->
      <!-- Line 1: MPU6050 -> mpu6050_module -> fall_detection -> mqtt_manager -->
      <path d="M 235,135 H 400" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <rect x="280" y="125" width="75" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="317.5" y="138" class="arrow-text" fill="#38bdf8">🔒 i2cMutex</text>

      <path d="M 630,135 H 710" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <!-- Line 1 Alert Arrow directly into mqtt_manager (y=135) -->
      <path d="M 1040,135 H 1320" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="1165" y="124" width="90" height="22" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
      <text x="1210" y="138" class="arrow-text" fill="#f97316" font-weight="600">🚨 CẢNH BÁO</text>


      <!-- Line 2: MAX30102 -> TaskMAX30102 -> mqtt_manager -->
      <path d="M 235,345 H 400" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <rect x="280" y="335" width="75" height="20" rx="4" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="317.5" y="348" class="arrow-text" fill="#c084fc">🔒 i2cMutex</text>

      <!-- Line 2 path: exits 1040,345 -> goes to 1100 -> turns UP along x=1115 to y=195 -> turns RIGHT to 1320 -->
      <path d="M 1040,345 H 1100 Q 1115,345 1115,330 V 210 Q 1115,195 1130,195 H 1320" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <rect x="1165" y="184" width="90" height="22" rx="4" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="1210" y="198" class="arrow-text" fill="#c084fc">💓 HR / SpO2</text>


      <!-- Line 3: LM75 -> lm75_module -> mqtt_manager -->
      <path d="M 235,555 H 400" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <rect x="280" y="545" width="75" height="20" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
      <text x="317.5" y="558" class="arrow-text" fill="#4ade80">🔒 i2cMutex</text>

      <!-- Line 3 path: exits 1040,555 -> goes to 1140 -> turns UP along x=1155 to y=255 -> turns RIGHT to 1320 -->
      <path d="M 1040,555 H 1140 Q 1155,555 1155,540 V 270 Q 1155,255 1170,255 H 1320" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <rect x="1165" y="244" width="90" height="22" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
      <text x="1210" y="258" class="arrow-text" fill="#4ade80">🌡️ NHIỆT ĐỘ</text>


      <!-- Cloud Internal: mqtt_manager -> HiveMQ Cloud -->
      <path d="M 1470,320 V 400" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="1420" y="347" width="100" height="20" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
      <text x="1470" y="360" class="arrow-text" fill="#f97316" font-weight="600">JSON TLS 8883</text>


      <!-- ================= LEGEND STRIP ================= -->
      <line x1="20" y1="650" x2="1640" y2="650" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="30" y="672" class="zone-title">CHÚ THÍCH (LEGEND):</text>

      <circle cx="210" cy="669" r="5" fill="#38bdf8"/>
      <text x="222" y="672" class="node-sub">Line 1: MPU6050 / Fall Engine (Core 1)</text>

      <circle cx="580" cy="669" r="5" fill="#c084fc"/>
      <text x="592" y="672" class="node-sub">Line 2: MAX30102 / SpO2 Task (Core 0)</text>

      <circle cx="950" cy="669" r="5" fill="#4ade80"/>
      <text x="962" y="672" class="node-sub">Line 3: LM75 / Nhiệt Độ</text>

      <circle cx="1270" cy="669" r="5" fill="#f97316"/>
      <text x="1282" y="672" class="node-sub" font-weight="600" fill="#f97316">Alert / Cloud Infrastructure</text>
    </svg>