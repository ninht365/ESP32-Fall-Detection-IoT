<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="diag-title diag-desc">
      <title id="diag-title">Sơ đồ Kiến trúc Hệ thống Elder Care ESP32-S3</title>
      <desc id="diag-desc">Sơ đồ 3 tuyến dữ liệu song song mở rộng chiều ngang từ MPU6050, MAX30102, LM75 dẫn trực tiếp tới Cloud MQTT với khoảng không thoáng đãng cho từng nhãn Mutex và Cảnh Báo.</desc>

      <defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
        .node-title { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 13px; fill: #0f172a; }
        .node-sub { font-family: 'Geist Mono', monospace; font-size: 9.5px; fill: #475569; }
        .node-tag { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.08em; }
        .zone-title { font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; fill: #475569; }
        .arrow-text { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #475569; letter-spacing: 0.05em; text-anchor: middle; }
      </style>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
        </marker>
        <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
        </marker>
        <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#c084fc"/>
        </marker>
      </defs>

      <!-- Background paper -->
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ================= TRACK 1: GIA TỐC & PHÁT HIỆN TÉ NGÃ (x: 20 -> 1120, y: 40 -> 220) ================= -->
      <rect x="20" y="40" width="1100" height="180" rx="8" fill="rgba(2, 132, 199, 0.08)" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="40" y="28" width="460" height="24" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
      <text x="270" y="44" class="zone-title" fill="#38bdf8" text-anchor="middle">🚀 LINE 1: GIA TỐC &amp; PHÁT HIỆN TÉ NGÃ (ESP32-S3 CORE 1)</text>

      <!-- MPU6050 -->
      <g transform="translate(45, 80)">
        <rect width="200" height="110" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="10" y="10" width="65" height="16" rx="3" fill="rgba(2, 132, 199, 0.08)"/>
        <text x="42.5" y="21" class="node-tag" fill="#38bdf8" text-anchor="middle">IMU 6-AXIS</text>
        <text x="100" y="52" class="node-title" text-anchor="middle">MPU6050 Sensor</text>
        <text x="100" y="72" class="node-sub" text-anchor="middle">Gia tốc &amp; Con quay (0x68)</text>
        <text x="100" y="88" class="node-sub" text-anchor="middle">Bus I2C (SDA:8 / SCL:9)</text>
      </g>

      <!-- mpu6050_module -->
      <g transform="translate(410, 80)">
        <rect width="240" height="110" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="120" y="32" class="node-title" text-anchor="middle">mpu6050_module</text>
        <text x="120" y="54" class="node-sub" text-anchor="middle">• Đọc raw ax, ay, az, gx, gy, gz</text>
        <text x="120" y="72" class="node-sub" text-anchor="middle">• Lọc EMA (α=0.6) làm mịn</text>
        <text x="120" y="90" class="node-sub" text-anchor="middle">• Cập nhật struct FilteredData</text>
      </g>

      <!-- fall_detection -->
      <g transform="translate(740, 70)">
        <rect width="340" height="135" rx="6" fill="rgba(234, 88, 12, 0.08)" stroke="#ea580c" stroke-width="2"/>
        <rect x="10" y="8" width="90" height="16" rx="3" fill="#ea580c"/>
        <text x="55" y="19" class="node-tag" fill="#ffffff" text-anchor="middle">FOCAL ENGINE</text>
        <text x="170" y="44" class="node-title" fill="#ea580c" text-anchor="middle">fall_detection State Machine</text>

        <line x1="15" y1="54" x2="325" y2="54" stroke="rgba(15, 23, 42, 0.1)"/>
        <text x="170" y="70" class="node-sub" text-anchor="middle">• Free Fall: &lt;0.3g | Impact: &gt;2.5g</text>
        <text x="170" y="86" class="node-sub" text-anchor="middle">• Stillness: 2000ms nằm yên</text>
        <text x="170" y="106" class="node-sub" fill="#ea580c" font-weight="600" text-anchor="middle">➔ KÍCH HOẠT CẢNH BÁO TÉ NGÃ</text>
      </g>


      <!-- ================= TRACK 2: NHỊP TIM & SPO2 (x: 20 -> 1120, y: 250 -> 430) ================= -->
      <rect x="20" y="250" width="1100" height="180" rx="8" fill="rgba(147, 51, 234, 0.08)" stroke="#c084fc" stroke-width="1.2"/>
      <rect x="40" y="238" width="530" height="24" rx="4" fill="#f8fafc" stroke="#c084fc" stroke-width="1"/>
      <text x="305" y="254" class="zone-title" fill="#c084fc" text-anchor="middle">💓 LINE 2: NHỊP TIM &amp; SPO2 (ESP32-S3 CORE 0 — DEDICATED DSP TASK)</text>

      <!-- MAX30102 -->
      <g transform="translate(45, 290)">
        <rect width="200" height="110" rx="6" fill="#f8fafc" stroke="#c084fc" stroke-width="1.5"/>
        <rect x="10" y="10" width="70" height="16" rx="3" fill="rgba(147, 51, 234, 0.08)"/>
        <text x="45" y="21" class="node-tag" fill="#c084fc" text-anchor="middle">PULSE &amp; SPO2</text>
        <text x="100" y="52" class="node-title" text-anchor="middle">MAX30102 Sensor</text>
        <text x="100" y="72" class="node-sub" text-anchor="middle">Quang học (I2C Addr: 0x57)</text>
        <text x="100" y="88" class="node-sub" text-anchor="middle">IR &amp; Red Channel @ 100Hz</text>
      </g>

      <!-- TaskMAX30102 -->
      <g transform="translate(410, 290)">
        <rect width="670" height="110" rx="6" fill="#f8fafc" stroke="#c084fc" stroke-width="1.5"/>
        <text x="335" y="32" class="node-title" text-anchor="middle">TaskMAX30102 (FreeRTOS Task 16KB Stack — Core 0)</text>

        <line x1="20" y1="46" x2="650" y2="46" stroke="rgba(15, 23, 42, 0.1)"/>
        <text x="335" y="66" class="node-sub" text-anchor="middle">• Sliding Window Buffer 100 samples (Thu thập &amp; xử lý tín hiệu liên tục)</text>
        <text x="335" y="84" class="node-sub" text-anchor="middle">• Peak Detection (RR-Interval) + Lọc Median 5 mẫu loại bỏ nhiễu nhịp tim đột biến</text>
        <text x="335" y="100" class="node-sub" text-anchor="middle">• Thuật toán Maxim SpO2 ➔ Đồng bộ chỉ số nhịp tim &amp; SpO2 vào healthData</text>
      </g>


      <!-- ================= TRACK 3: NHIỆT ĐỘ CƠ THỂ (x: 20 -> 1120, y: 460 -> 640) ================= -->
      <rect x="20" y="460" width="1100" height="180" rx="8" fill="rgba(22, 163, 74, 0.08)" stroke="#4ade80" stroke-width="1.2"/>
      <rect x="40" y="448" width="400" height="24" rx="4" fill="#f8fafc" stroke="#4ade80" stroke-width="1"/>
      <text x="240" y="464" class="zone-title" fill="#4ade80" text-anchor="middle">🌡️ LINE 3: NHIỆT ĐỘ CƠ THỂ (LM75 POLLING)</text>

      <!-- LM75 Sensor -->
      <g transform="translate(45, 500)">
        <rect width="200" height="110" rx="6" fill="#f8fafc" stroke="#4ade80" stroke-width="1.5"/>
        <rect x="10" y="10" width="60" height="16" rx="3" fill="rgba(22, 163, 74, 0.08)"/>
        <text x="40" y="21" class="node-tag" fill="#4ade80" text-anchor="middle">TEMP I2C</text>
        <text x="100" y="52" class="node-title" text-anchor="middle">LM75 Sensor</text>
        <text x="100" y="72" class="node-sub" text-anchor="middle">Nhiệt độ (I2C Addr: 0x48)</text>
        <text x="100" y="88" class="node-sub" text-anchor="middle">Độ phân giải 0.125°C</text>
      </g>

      <!-- lm75_module -->
      <g transform="translate(410, 500)">
        <rect width="670" height="110" rx="6" fill="#f8fafc" stroke="#4ade80" stroke-width="1.2"/>
        <text x="335" y="32" class="node-title" text-anchor="middle">lm75_module (Polling Nhiệt Độ)</text>

        <line x1="20" y1="46" x2="650" y2="46" stroke="rgba(15, 23, 42, 0.1)"/>
        <text x="335" y="68" class="node-sub" text-anchor="middle">• Truy vấn thanh ghi 0x00 định kỳ 5000ms/lần qua I2C Bus</text>
        <text x="335" y="88" class="node-sub" text-anchor="middle">• Chuyển đổi định dạng 11-bit Two's Complement ➔ Ghi nhiệt độ cơ thể (°C) vào healthData</text>
      </g>


      <!-- ================= RIGHT REGION: CLOUD INFRASTRUCTURE (x: 1240 -> 1580) ================= -->
      <rect x="1240" y="40" width="340" height="600" rx="8" fill="rgba(148, 163, 184, 0.02)" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1.2"/>
      <rect x="1260" y="28" width="300" height="24" rx="4" fill="#f8fafc" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1"/>
      <text x="1410" y="44" class="zone-title" text-anchor="middle">☁️ 4. CLOUD INFRASTRUCTURE (TLS MQTT)</text>

      <!-- mqtt_manager -->
      <g transform="translate(1260, 90)">
        <rect width="300" height="230" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="12" y="10" width="75" height="18" rx="3" fill="rgba(2, 132, 199, 0.08)"/>
        <text x="49.5" y="22" class="node-tag" fill="#38bdf8" text-anchor="middle">TLS / MQTT</text>
        <text x="150" y="48" class="node-title" text-anchor="middle">mqtt_manager</text>
        <text x="150" y="68" class="node-sub" text-anchor="middle">WiFi STA &amp; WiFiClientSecure Client</text>

        <line x1="20" y1="80" x2="280" y2="80" stroke="rgba(15, 23, 42, 0.1)"/>
        <text x="150" y="102" class="node-sub" text-anchor="middle">• Kết nối WiFi 2.4GHz với Auto-Reconnect</text>
        <text x="150" y="124" class="node-sub" text-anchor="middle">• ArduinoJson Payload Serializer</text>
        <text x="150" y="146" class="node-sub" text-anchor="middle">• Thu thập sinh hiệu từ healthData (healthMutex)</text>
        <text x="150" y="168" class="node-sub" text-anchor="middle">• Đóng gói JSON Payload bảo mật</text>
        <text x="150" y="195" class="node-sub" fill="#ea580c" font-weight="600" text-anchor="middle">➔ Gửi định kỳ 1Hz &amp; Phát tức thì khi Té Ngã</text>
      </g>

      <!-- HiveMQ Cloud Broker -->
      <g transform="translate(1260, 400)">
        <rect width="300" height="210" rx="8" fill="#f8fafc" stroke="#f97316" stroke-width="1.5"/>
        <rect x="12" y="10" width="85" height="18" rx="3" fill="rgba(234, 88, 12, 0.08)"/>
        <text x="54.5" y="22" class="node-tag" fill="#f97316" text-anchor="middle">CLOUD BROKER</text>
        <text x="150" y="48" class="node-title" fill="#f97316" text-anchor="middle">HiveMQ Cloud Broker</text>
        <text x="150" y="68" class="node-sub" text-anchor="middle">TLS/SSL Security (Port 8883)</text>

        <line x1="20" y1="80" x2="280" y2="80" stroke="rgba(15, 23, 42, 0.1)"/>
        <text x="150" y="105" class="node-sub" text-anchor="middle">• Topic: eldercare/test_nga</text>
        <text x="150" y="130" class="node-sub" fill="#f97316" font-weight="600" text-anchor="middle">• Nhận Real-time JSON Payload</text>
        <text x="150" y="150" class="node-sub" text-anchor="middle">(Nhịp tim, SpO2, Nhiệt độ cơ thể)</text>
        <text x="150" y="175" class="node-sub" fill="#ea580c" font-weight="600" text-anchor="middle">+ Cảnh Báo Té Ngã Khẩn Cấp</text>
      </g>


      <!-- ================= ARROWS & CONNECTORS (RỘNG RÃI, THOÁNG ĐÃNG - ABSOLUTELY NO OVERLAPS) ================= -->

      <!-- i2cMutex badges between Sensors (x=245) and Modules (x=410) - Gap 165px -->
      <!-- Line 1: MPU6050 -> mpu6050_module -> fall_detection -> mqtt_manager -->
      <path d="M 245,135 H 410" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <rect x="295" y="125" width="75" height="20" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
      <text x="332.5" y="138" class="arrow-text" fill="#38bdf8">🔒 i2cMutex</text>

      <path d="M 650,135 H 740" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

      <path d="M 1080,135 H 1260" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="1125" y="123" width="90" height="22" rx="4" fill="#f8fafc" stroke="#ea580c" stroke-width="1.2"/>
      <text x="1170" y="137" class="arrow-text" fill="#ea580c" font-weight="600">🚨 CẢNH BÁO</text>


      <!-- Line 2: MAX30102 -> TaskMAX30102 -> mqtt_manager -->
      <path d="M 245,345 H 410" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <rect x="295" y="335" width="75" height="20" rx="4" fill="#f8fafc" stroke="#c084fc" stroke-width="1"/>
      <text x="332.5" y="348" class="arrow-text" fill="#c084fc">🔒 i2cMutex</text>

      <path d="M 1080,345 H 1150 Q 1165,345 1165,330 V 210 Q 1165,195 1180,195 H 1260" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
      <rect x="1125" y="260" width="80" height="22" rx="4" fill="#f8fafc" stroke="#c084fc" stroke-width="1"/>
      <text x="1165" y="274" class="arrow-text" fill="#c084fc">💓 HR / SpO2</text>


      <!-- Line 3: LM75 -> lm75_module -> mqtt_manager -->
      <path d="M 245,555 H 410" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <rect x="295" y="545" width="75" height="20" rx="4" fill="#f8fafc" stroke="#4ade80" stroke-width="1"/>
      <text x="332.5" y="558" class="arrow-text" fill="#4ade80">🔒 i2cMutex</text>

      <path d="M 1080,555 H 1195 Q 1210,555 1210,540 V 270 Q 1210,255 1225,255 H 1260" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <rect x="1170" y="420" width="80" height="22" rx="4" fill="#f8fafc" stroke="#4ade80" stroke-width="1"/>
      <text x="1210" y="434" class="arrow-text" fill="#4ade80">🌡️ NHIỆT ĐỘ</text>


      <!-- Cloud Internal: mqtt_manager -> HiveMQ Cloud -->
      <path d="M 1410,320 V 400" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="1360" y="347" width="100" height="20" rx="4" fill="#f8fafc" stroke="#ea580c" stroke-width="1"/>
      <text x="1410" y="360" class="arrow-text" fill="#ea580c" font-weight="600">JSON TLS 8883</text>


      <!-- ================= LEGEND STRIP ================= -->
      <line x1="20" y1="650" x2="1580" y2="650" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1"/>
      <text x="30" y="672" class="zone-title">CHÚ THÍCH (LEGEND):</text>

      <circle cx="210" cy="669" r="5" fill="#38bdf8"/>
      <text x="222" y="672" class="node-sub">Line 1: MPU6050 / Fall Engine (Core 1)</text>

      <circle cx="560" cy="669" r="5" fill="#c084fc"/>
