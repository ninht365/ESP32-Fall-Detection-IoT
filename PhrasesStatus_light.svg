<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" role="img" aria-labelledby="diag-title diag-desc">
      <title id="diag-title">Sơ đồ Máy trạng thái Phát hiện Té ngã ESP32-S3</title>
      <desc id="diag-desc">Sơ đồ 5 trạng thái phát hiện té ngã với 1 đường bus nét đứt dùng chung phẳng phiu duy nhất bên phải.</desc>

      <defs>
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
            .node-title { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 13px; fill: #0f172a; }
            .node-sub { font-family: 'Geist Mono', monospace; font-size: 9.5px; fill: #475569; }
            .node-tag { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.08em; }
            .zone-title { font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; fill: #475569; }
            .arrow-text { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #475569; letter-spacing: 0.05em; text-anchor: middle; }
          </style>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
        </marker>
        <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
        </marker>
      </defs>

      <!-- Background paper -->
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ================= START NODE ================= -->
      <circle cx="600" cy="35" r="9" fill="#0284c7"/>
      <circle cx="600" cy="35" r="14" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,2"/>
      <path d="M 600,49 V 90" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      <text x="600" y="20" class="arrow-text" fill="#0284c7">START</text>

      <!-- ================= 1. PHASE_IDLE (x: 470 -> 730, width: 260, y: 90 -> 148) ================= -->
      <g transform="translate(470, 90)">
        <rect width="260" height="58" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="10" y="6" width="65" height="14" rx="3" fill="rgba(2, 132, 199, 0.08)"/>
        <text x="42.5" y="16" class="node-tag" fill="#38bdf8" text-anchor="middle">STATE 01</text>
        <text x="130" y="38" class="node-title" text-anchor="middle">PHASE_IDLE</text>
        <text x="130" y="50" class="node-sub" text-anchor="middle">Trạng thái giám sát bình thường</text>
      </g>


      <!-- ================= 2. PHASE_FREE_FALL (x: 470 -> 730, width: 260, y: 230 -> 288) ================= -->
      <g transform="translate(470, 230)">
        <rect width="260" height="58" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.2"/>
        <rect x="10" y="6" width="65" height="14" rx="3" fill="rgba(2, 132, 199, 0.08)"/>
        <text x="42.5" y="16" class="node-tag" fill="#38bdf8" text-anchor="middle">STATE 02</text>
        <text x="130" y="38" class="node-title" text-anchor="middle">PHASE_FREE_FALL</text>
        <text x="130" y="50" class="node-sub" text-anchor="middle">Phát hiện rơi tự do (Free Fall)</text>
      </g>


      <!-- ================= 3. PHASE_IMPACT (x: 470 -> 730, width: 260, y: 370 -> 428) ================= -->
      <g transform="translate(470, 370)">
        <rect width="260" height="58" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.2"/>
        <rect x="10" y="6" width="65" height="14" rx="3" fill="rgba(2, 132, 199, 0.08)"/>
        <text x="42.5" y="16" class="node-tag" fill="#38bdf8" text-anchor="middle">STATE 03</text>
        <text x="130" y="38" class="node-title" text-anchor="middle">PHASE_IMPACT</text>
        <text x="130" y="50" class="node-sub" text-anchor="middle">Chờ phát hiện va chạm mạnh</text>
      </g>


      <!-- ================= 4. PHASE_WAITING_STILL (x: 470 -> 730, width: 260, y: 510 -> 568) ================= -->
      <g transform="translate(470, 510)">
        <rect width="260" height="58" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.2"/>
        <rect x="10" y="6" width="65" height="14" rx="3" fill="rgba(2, 132, 199, 0.08)"/>
        <text x="42.5" y="16" class="node-tag" fill="#38bdf8" text-anchor="middle">STATE 04</text>
        <text x="130" y="38" class="node-title" text-anchor="middle">PHASE_WAITING_STILL</text>
        <text x="130" y="50" class="node-sub" text-anchor="middle">Giám sát nạn nhân nằm yên</text>
      </g>


      <!-- ================= 5. PHASE_COOLDOWN (FOCAL ACCENT NODE: x: 440 -> 760, width: 320, y: 650 -> 718) ================= -->
      <g transform="translate(440, 650)">
        <rect width="320" height="68" rx="8" fill="rgba(234, 88, 12, 0.08)" stroke="#ea580c" stroke-width="2.5"/>
        <rect x="10" y="6" width="95" height="16" rx="3" fill="#ea580c"/>
        <text x="57.5" y="17" class="node-tag" fill="#ffffff" text-anchor="middle">ALERT &amp; RESET</text>
        <text x="160" y="39" class="node-title" fill="#ea580c" text-anchor="middle">PHASE_COOLDOWN</text>
        <text x="160" y="56" class="node-sub" fill="#ea580c" font-weight="600" text-anchor="middle">🚨 ĐÃ GỬI CẢNH BÁO TÉ NGÃ KHẨN CẤP</text>
      </g>


      <!-- ================= HAPPY PATH VERTICAL CONNECTORS (DOWNWARDS) ================= -->

      <!-- IDLE -> FREE_FALL -->
      <path d="M 600,148 V 230" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
      <rect x="460" y="176" width="280" height="24" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
      <text x="600" y="191" class="arrow-text" fill="#38bdf8" font-weight="600">📉 accMag &lt; 0.3g (Bắt đầu rơi)</text>

      <!-- FREE_FALL -> IMPACT -->
      <path d="M 600,288 V 370" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
      <rect x="435" y="316" width="330" height="24" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
      <text x="600" y="331" class="arrow-text" fill="#38bdf8" font-weight="600">⏱️ 100ms ≤ t_fall ≤ 1000ms (Xác nhận rơi)</text>

      <!-- IMPACT -> WAITING_STILL -->
      <path d="M 600,428 V 510" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
      <rect x="440" y="456" width="320" height="24" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
      <text x="600" y="471" class="arrow-text" fill="#38bdf8" font-weight="600">💥 accMag &gt; 2.5g (Phát hiện va chạm mạnh)</text>

      <!-- WAITING_STILL -> COOLDOWN (ACCENT ALERT TRIGGER) -->
      <path d="M 600,568 V 650" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
      <rect x="420" y="595" width="360" height="24" rx="4" fill="#f8fafc" stroke="#ea580c" stroke-width="1.2"/>
      <text x="600" y="611" class="arrow-text" fill="#ea580c" font-weight="600">🚨 Nằm yên ≥ 2000ms ➔ KÍCH HOẠT CẢNH BÁO</text>


      <!-- ================= LEFT RETURN CORRIDOR (FREE_FALL RESET) ================= -->
      <path d="M 470,259 H 235 Q 220,259 220,244 V 134 Q 220,119 235,119 H 470" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="235" y="247" width="225" height="24" rx="4" fill="#f8fafc" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1"/>
      <text x="347.5" y="262" class="arrow-text" fill="#475569">❌ t_fall &lt; 100ms / &gt; 1000ms (Rơi giả)</text>


      <!-- ================= RIGHT SHARED RETURN BUS CORRIDOR (SINGLE UNIFIED DASHED LINE AT x=920) ================= -->

      <!-- Main Unified Return Bus Line (From COOLDOWN at y=684 all the way UP to PHASE_IDLE at y=119) -->
      <path d="M 760,684 H 905 Q 920,684 920,669 V 134 Q 920,119 905,119 H 730" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Path 1 Join into Shared Bus: IMPACT Timeout > 1000ms -->
      <path d="M 730,399 H 905 Q 920,399 920,384" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
      <rect x="740" y="387" width="165" height="24" rx="4" fill="#f8fafc" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1"/>
      <text x="822.5" y="402" class="arrow-text" fill="#475569">⏱️ Timeout &gt; 1000ms (Bỏ qua)</text>

      <!-- Path 2 Join into Shared Bus: WAITING_STILL Timeout > 3000ms -->
      <path d="M 730,539 H 905 Q 920,539 920,524" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
      <rect x="740" y="527" width="165" height="24" rx="4" fill="#f8fafc" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1"/>
      <text x="822.5" y="542" class="arrow-text" fill="#475569">🏃 Timeout &gt; 3000ms (Cử động)</text>

      <!-- Path 3 Badge on COOLDOWN Exit Segment -->
      <rect x="765" y="672" width="140" height="24" rx="4" fill="#f8fafc" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1"/>
      <text x="835" y="687" class="arrow-text" fill="#475569">🔄 Sau 3000ms Cooldown</text>

    </svg>